name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (JDK 17, perfil h2)
    runs-on: ubuntu-latest
    env:
      # H2 en memoria: los tests no necesitan MySQL ni credenciales reales.
      SPRING_PROFILES_ACTIVE: h2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar tests
        run: ./mvnw -B test
