# Configuración del análisis automático de SonarCloud.
# data.sql son datos semilla del perfil h2 (pruebas y desarrollo local): sus
# INSERT repiten las mismas subconsultas a propósito y no son código de la
# aplicación, así que no cuentan para la métrica de duplicación (TP-209).
sonar.cpd.exclusions=src/main/resources/data.sql
