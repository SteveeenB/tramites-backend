spring.application.name=tramites
 
# Base de datos MySQL
# DB_URL ejemplo: jdbc:mysql://host:3306/tramites_posgrados?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
 
# Puerto (Render inyecta PORT; localmente usa 8080)
server.port=${PORT:8080}
 
# HikariCP — límite de conexiones (ajustar según el tier del proveedor MySQL)
# Con 3 conexiones bastaban 3 peticiones lentas (subida a Supabase, PDF) para dejar
# a todo el backend esperando y devolver 500 ("Connection is not available").
# Railway MySQL admite muchas más; DB_POOL_SIZE permite ajustarlo desde Render.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
# Reciclar conexiones antes de que el proxy de Railway las corte por inactividad
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# TP-150 (SC02-T2): el esquema lo gestiona Flyway (db/migration). Hibernate ya
# no altera tablas: solo valida al arrancar que las entidades coincidan con la
# BD. Si en un despliegue la validación falla y hay que salir del paso, Render
# puede definir DDL_AUTO=update temporalmente mientras se escribe la migración.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Flyway — migraciones versionadas (cierra el riesgo R6)
# baseline-on-migrate: en una BD que ya tiene tablas (Railway) y aún no tiene
# historial de Flyway, la marca como versión 1 SIN ejecutar V1; en una BD vacía
# ejecuta V1 y crea todo el esquema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema existente creado con ddl-auto=update
# Desactivado por defecto: en producción llena los logs con cada SQL. Para
# depurar en local: SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}
# Open-in-view mantiene la sesión de Hibernate (y su conexión JDBC) abierta
# durante TODA la petición. En el SSE de notificaciones (SseEmitter sin timeout)
# eso retiene una conexión del pool por cada suscriptor conectado, y con pocas
# recargas se agota el pool ("Connection is not available", active=N). Los
# modelos no usan carga LAZY, así que desactivarlo no rompe nada.
spring.jpa.open-in-view=false
# Con Flyway, data.sql no se ejecuta en este perfil (el esquema y su evolución
# van en db/migration). Solo el perfil h2 lo usa para sembrar datos demo.
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql
 
# CORS — origen permitido (frontend)
cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}

# URL pública del frontend (usada en QR de certificados)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
 
# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
 
# Supabase Storage
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_BUCKET:tramites-documentos}
 
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB
 
# Configuración de correo (MailHog en localhost para desarrollo)
# Para activar envío real: apunta a tu SMTP y completa usuario/contraseña
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# Timeouts SMTP (ms). Sin ellos el valor por defecto es "infinito" (-1) y, si el
# puerto está bloqueado (Render free bloquea 25/465/587), el envío espera ~2 min
# del timeout del SO, dejando colgada la petición y la conexión de BD que use.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:5000}
 
# "dev" NO va en el fallback: activa demo.auth.enabled=true (login sin contraseña vía
# /api/auth/login-demo). Si Render no define SPRING_PROFILES_ACTIVE, este es el valor
# que corre en producción. Para probar el login demo en tu máquina, actívalo así:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local,dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JWT — sin fallback: si JWT_SECRET no está definido, el arranque debe fallar
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Google OAuth — client ID para validar id_token
google.client-id=${GOOGLE_CLIENT_ID:}

# Demo login — solo activo en perfil dev
demo.auth.enabled=false

# Wompi
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.integrity-key=${WOMPI_INTEGRITY_KEY:}
wompi.events-secret=${WOMPI_EVENTS_SECRET:}
wompi.redirect-url=${WOMPI_REDIRECT_URL:http://localhost:3000/pago/resultado}

# Módulo de Matrícula (SC-03 · TP-146). Contrato v0.1 de TP-143, umbrales de RNF06.
# modo: mock (datos simulados, mientras el servicio real no exista) | http (API real)
# MATRICULA_URL incluye el prefijo de aplicación, ej. https://host/posgrados-project
matricula.modo=${MATRICULA_MODO:mock}
matricula.url=${MATRICULA_URL:}
# Cuenta técnica con rol «Servicio Tramites» en Matrícula (POST /auth/login).
matricula.usuario=${MATRICULA_USUARIO:}
matricula.password=${MATRICULA_PASSWORD:}
matricula.timeout-conexion-ms=${MATRICULA_TIMEOUT_CONEXION_MS:2000}
matricula.timeout-respuesta-ms=${MATRICULA_TIMEOUT_RESPUESTA_MS:5000}
matricula.max-reintentos=${MATRICULA_MAX_REINTENTOS:2}
matricula.presupuesto-ms=${MATRICULA_PRESUPUESTO_MS:15000}
