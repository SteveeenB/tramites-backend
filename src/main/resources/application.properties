spring.application.name=tramites
 
# Base de datos PostgreSQL - Supabase
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
 
# Puerto (Render inyecta PORT; localmente usa 8080)
server.port=${PORT:8080}
 
# HikariCP — limitar conexiones para Supabase Session mode (free tier)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
 
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
# spring.sql.init.data-locations=classpath:data.sql
 
# CORS — origen permitido (frontend)
cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}
 
# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
 
# Supabase Storage
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_BUCKET:tramites-documentos}
 
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB
 
# Configuración de correo (SMTP) — TODO por variables de entorno, sin credenciales en el repo.
# Host/puerto tienen default de Gmail; usuario y contraseña NO tienen default (fail-fast si faltan).
# Para local sin SMTP, define MAIL_USERNAME/MAIL_PASSWORD (vacíos o reales) en application-local.properties.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
 
spring.profiles.active=local,dev

# JWT
jwt.secret=${JWT_SECRET:tramites_posgrados_secret_key_CHANGE_IN_PROD_32chars}
jwt.expiration-ms=86400000

# Google OAuth — client ID para validar id_token
google.client-id=${GOOGLE_CLIENT_ID:}

# Demo login — solo activo en perfil dev
demo.auth.enabled=false
