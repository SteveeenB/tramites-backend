# Perfil H2 in-memory para arranque local sin depender del MySQL remoto.
# Activar con: -Dspring-boot.run.profiles=h2
# NO usar en prod. La data se pierde en cada reinicio.

spring.datasource.url=jdbc:h2:mem:tramites;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# La configuración de correo real de Gmail rompe el arranque si no hay red;
# desactivamos autoconfig de mail para el perfil H2.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

demo.auth.enabled=true

# FIX TP-195 (Kevin Arias, 07/10/2026): jwt.secret dummy solo para el perfil
# h2 (local/tests), para que ./mvnw test y el arranque local sin MySQL no
# dependan de la variable de entorno JWT_SECRET. En prod se sigue exigiendo
# JWT_SECRET definido en application.properties sin fallback.
jwt.secret=h2-profile-only-not-for-production-min-32-characters
