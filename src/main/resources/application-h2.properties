# Perfil H2 in-memory para arranque local sin depender del MySQL remoto.
# Activar con: -Dspring-boot.run.profiles=h2
# NO usar en prod. La data se pierde en cada reinicio.

spring.datasource.url=jdbc:h2:mem:tramites;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# La configuración de correo real de Gmail rompe el arranque si no hay red;
# desactivamos autoconfig de mail para el perfil H2.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

demo.auth.enabled=true
